<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>Lane Dodger</title>
        <link rel="stylesheet" href="css/game.css" />
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    </head>
    <body data-state="ready">

        <div id="game"></div>

        <div id="hud">
            <a id="back-btn" href="index.html">← Garage</a>
            <div id="car-name">Loading…</div>
        </div>

        <div id="scoreboard">
            <div id="score">0 m</div>
            <div id="best">Best 0 m</div>
        </div>

        <div id="difficulty" role="radiogroup" aria-label="Difficulty">
            <button data-level="easy" role="radio">Easy</button>
            <button data-level="normal" role="radio">Normal</button>
            <button data-level="hard" role="radio">Hard</button>
        </div>

        <div id="start-screen" class="overlay">
            <div class="overlay-content">
                <img class="hero-portrait" alt="" hidden>
                <h1>Lane Dodger</h1>
                <p class="hint">Swipe left or right to change lanes.<br>
                    On a keyboard, use the arrow keys.<br>
                    The first hit slows you down. The second ends the run.</p>
                <p id="start-best"></p>
                <button id="start-btn" class="primary-btn">Tap to start</button>
            </div>
        </div>

        <div id="gameover-screen" class="overlay" hidden>
            <div class="overlay-content">
                <img class="hero-portrait" alt="" hidden>
                <h2>Game over</h2>
                <p id="final-score">0 m</p>
                <p id="final-best">Best 0 m</p>
                <button id="restart-btn" class="primary-btn">Play again</button>
                <a href="index.html" class="secondary-btn">Back to garage</a>
            </div>
        </div>

        <div id="loading-screen">
            <div id="lottie-container"></div>
            <p id="loading-text">Warming up the engine…</p>
        </div>

        <script>
            lottie.loadAnimation({
                container: document.getElementById('lottie-container'),
                renderer: 'svg',
                loop: true,
                autoplay: true,
                path: 'assets/loader.json'
            });
        </script>

        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
                }
            }
        </script>

        <script type="module" src="js/game.js"></script>

    </body>
</html>
