<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AR View</title>
        <link rel="stylesheet" href="css/ar.css" />
        <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    </head>
    <body>

        <button id="back-btn" onclick="history.back()">← Back</button>
        <button id="flyer-btn" hidden aria-label="Let him fly">
            <img alt="">
        </button>
        <div id="car-name-label">Loading...</div>
        <div id="status">Looking for marker...</div>

        <div id="onboarding">
            <img src="assets/targets/card.png" alt="" />
            <p>Point your camera at the marker</p>
        </div>

        <button id="screenshot-btn" hidden>📷 Save photo</button>

        <a-scene
            mindar-image="imageTargetSrc: assets/targets/card.mind;uiScanning: no; uiLoading: yes"
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights: true"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">
            <a-camera position="0 0 0"
                look-controls="enabled: false"></a-camera>

            <!-- <a-entity id="target" mindar-image-target="targetIndex: 0">
                <a-plane width="1" height="0.552" color="#f59e0b" opacity="0.25"></a-plane>
                <a-box
                    width="0.3"
                    height="0.3"
                    depth="0.3"
                    position="0 0 0.15"
                    color="#f59e0b"
                    animation="property: rotation; to: 0 0 360; loop: true; dur: 4000; easing: linear"
                ></a-box>
            </a-entity> -->

            <a-entity light="type: ambient; intensity: 1"></a-entity>
            <a-entity light="type: directional; intensity: 1.5" position="0 1 2"></a-entity>

            <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>

        </a-scene>

        <script src="js/ar.js"></script>

    </body>
</html>
